version: "3.4"

services:
  oss-server:
    image: ${OSS_IMAGE:-oss-server:latest}
    build:
      context: ..
      dockerfile: dist/Dockerfile
      args:
        CARGO_FEATURES: ${CARGO_FEATURES:-}
    container_name: ${OSS_CONTAINER_NAME:-oss-server}
    restart: unless-stopped
    ports:
      # Host port (OSS_PORT) -> container port 8080.
      - "${OSS_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Fixed inside the container so the healthcheck always works.
      OSS_HOST: 0.0.0.0:8080
      OSS_DATA_DIR: /data
      OSS_DB_URL: ${OSS_DB_URL:-redb:///data/oss.db}
    volumes:
      # Host-visible data directory: object files + redb metadata.
      - ${OSS_DATA_HOST_DIR:-./data}:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

