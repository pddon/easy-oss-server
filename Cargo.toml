[package]
name = "oss-server"
version = "0.1.1"
edition = "2021"
description = "A lightweight distributed OSS server built with Rust + Axum + redb"
license = "MIT OR Apache-2.0"
rust-version = "1.87"
readme = "README.md"
repository = "https://github.com/pddon/easy-oss-server"
homepage = "https://github.com/pddon/easy-oss-server"

[features]
# 默认 feature 保持纯 Rust、零 C 依赖。
default = []
# 启用 MySQL 后端（纯 Rust sqlx，不引入 sqlite/postgres 的 bundled C 依赖）。
mysql = ["dep:sqlx", "dep:url"]

[dependencies]
# Web framework
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json", "multipart", "query", "form", "matched-path"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "net"] }
tokio-stream = "0.1"
tower = { version = "0.4", default-features = false, features = ["util"] }
tower-http = { version = "0.5", default-features = false, features = ["cors", "limit", "trace", "compression-gzip"] }

# Database (redb - pure Rust embedded database, no C compiler needed)
redb = "2.1"
bincode = "1.3"

# Optional MySQL backend (pure Rust driver; only compiled with `--features mysql`)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql"], optional = true }
url = { version = "2", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
md-5 = "0.10"
aes-gcm = "0.10"
urlencoding = "2"

# UUID
uuid = { version = "1", features = ["v4", "fast-rng"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Configuration
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "time"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Static file embedding
rust-embed = { version = "8", default-features = false, features = ["mime-guess"] }

# HTTP types
http = "1"
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
mime_guess = "2"
async-trait = "0.1"

# LRU cache
lru = "0.12"

# Validation
regex = "1"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "multipart"] }
tokio-test = "0.4"
rand = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
