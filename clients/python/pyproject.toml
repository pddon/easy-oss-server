[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-s3-client"
version = "0.1.0"
description = "Official Python client SDK for the S3-compatible OSS server (SigV4, path-style, zero dependencies)"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "OSS Server Team" }]
keywords = ["oss", "s3", "sigv4", "object-storage", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Archiving :: Backup",
]

[project.urls]
Homepage = "https://github.com/pddon/easy-oss-server"
Repository = "https://github.com/pddon/easy-oss-server"
Documentation = "https://github.com/pddon/easy-oss-server/tree/main/clients/python#readme"
Issues = "https://github.com/pddon/easy-oss-server/issues"

[tool.setuptools]
packages = ["oss_client"]
license-files = ["LICENSE"]
