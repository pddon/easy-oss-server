[package]
name = "oss-s3-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Official Rust client SDK for OSS Server's S3-compatible API (SigV4, path-style)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/pddon/easy-oss-server"
homepage = "https://github.com/pddon/easy-oss-server"
documentation = "https://docs.rs/oss-s3-client"
keywords = ["oss", "s3", "storage", "client"]
categories = ["api-bindings"]
# 发布内容白名单：只带源码、README 与两份许可证，避免把 tests/ 之外的本地产物打进 crate。
include = ["src/**/*", "tests/**/*", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
reqwest = { version = "0.12", features = ["stream", "default-tls"] }
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"

[dev-dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", features = ["stream", "default-tls", "json"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
